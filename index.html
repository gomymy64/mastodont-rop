<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Мастодонт РОП — Контроль качества звонков</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=Archivo+Black&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --brand-accent:#F2DB82;
  --brand-accent-deep:#F3D047;
  --brand-amber:#E2AB1A;
  --brand-violet:#641B9C;
  --brand-magenta:#E919D6;
  --brand-coral:#D37249;
  --bg:#0A0A0A;
  --bg-1:#171717;
  --bg-2:#202020;
  --bg-3:#2A2A2A;
  --bg-glass:rgba(217,217,217,0.03);
  --fg-1:#F4F4F4;
  --fg-2:#E8E8E8;
  --fg-3:#A6A6A6;
  --fg-4:#6B6B6B;
  --fg-invert:#0A0A0A;
  --border-1:rgba(255,255,255,0.08);
  --border-2:rgba(255,255,255,0.14);
  --good:#7CDB8E;
  --warn:#F2DB82;
  --bad:#E55B5B;
  --r-sm:12px; --r-md:20px; --r-lg:32px; --r-xl:44px;
  --ease-out:cubic-bezier(0.22,1,0.36,1);
  --font-sans:'Manrope',-apple-system,Inter,system-ui,sans-serif;
  --font-display:'Archivo Black',Impact,system-ui,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,monospace;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{
  background:var(--bg);
  color:var(--fg-1);
  font-family:var(--font-sans);
  font-size:16px;
  line-height:1.5;
  letter-spacing:-0.01em;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  min-height:100vh;
}
body::before{
  content:'';
  position:fixed; inset:0;
  background:radial-gradient(ellipse 1200px 800px at 80% -10%, rgba(100,27,156,0.18), transparent 60%),
             radial-gradient(ellipse 800px 600px at -10% 110%, rgba(211,114,73,0.08), transparent 60%);
  pointer-events:none;
  z-index:0;
}
body > *{position:relative; z-index:1}

button{cursor:pointer; font-family:inherit; border:none; background:none; color:inherit}
a{color:inherit; text-decoration:none}
[hidden]{display:none !important}

/* === NAV === */
.nav{
  display:flex; align-items:center; justify-content:space-between;
  padding:20px 48px;
  border-bottom:1px solid var(--border-1);
  backdrop-filter:blur(20px);
  position:sticky; top:0; z-index:50;
  background:rgba(10,10,10,0.7);
}
.nav-brand{display:flex; align-items:center; gap:14px}
.nav-bolt{
  width:42px; height:42px;
  background:var(--brand-accent);
  border-radius:12px;
  display:flex; align-items:center; justify-content:center;
  color:var(--fg-invert);
  font-weight:900; font-size:24px;
  box-shadow:0 12px 28px -10px rgba(242,219,130,0.45);
}
.nav-title{
  font-family:var(--font-sans);
  font-weight:700;
  font-size:18px;
  letter-spacing:-0.02em;
}
.nav-title span{color:var(--brand-accent)}
.nav-meta{
  font-family:var(--font-display);
  font-size:11px;
  letter-spacing:0.18em;
  color:var(--fg-3);
  text-transform:uppercase;
}
.nav-right{display:flex; align-items:center; gap:24px}
.nav-period{
  display:flex;
  background:var(--bg-2);
  border:1px solid var(--border-1);
  border-radius:var(--r-xl);
  padding:4px;
}
.nav-period button{
  padding:8px 18px;
  border-radius:var(--r-xl);
  font-size:13px;
  font-weight:600;
  color:var(--fg-3);
  letter-spacing:-0.01em;
  transition:all 200ms var(--ease-out);
}
.nav-period button.active{
  background:var(--brand-accent);
  color:var(--fg-invert);
}
.nav-period button:hover:not(.active){color:var(--fg-1)}
.nav-user{
  width:42px; height:42px;
  border-radius:50%;
  background:var(--bg-2);
  border:1px solid var(--border-2);
  display:flex; align-items:center; justify-content:center;
  font-weight:700; font-size:14px;
}

/* === SHELL === */
.shell{
  max-width:1440px;
  margin:0 auto;
  padding:48px;
}
.eyebrow{
  font-family:var(--font-display);
  font-size:11px;
  letter-spacing:0.18em;
  text-transform:uppercase;
  color:var(--fg-3);
  margin-bottom:14px;
}
.eyebrow.accent{color:var(--brand-accent)}

/* === HEADER === */
.page-h{display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:48px; gap:32px}
.page-h h1{
  font-family:var(--font-sans);
  font-weight:700;
  font-size:clamp(48px,6vw,88px);
  line-height:0.94;
  letter-spacing:-0.05em;
}
.page-h h1 .accent{color:var(--brand-accent)}
.page-h-meta{
  text-align:right;
  font-family:var(--font-mono);
  font-size:13px;
  color:var(--fg-3);
  line-height:1.6;
}

/* === AI INSIGHTS BANNER === */
.insights{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:16px;
  margin-bottom:48px;
}
.insight{
  background:var(--bg-1);
  border:1px solid var(--border-1);
  border-radius:var(--r-md);
  padding:24px;
  position:relative;
  overflow:hidden;
  transition:all 240ms var(--ease-out);
}
.insight:hover{transform:translateY(-2px); border-color:var(--border-2)}
.insight.urgent{
  border-color:rgba(229,91,91,0.4);
  background:linear-gradient(180deg, rgba(229,91,91,0.06), var(--bg-1));
}
.insight.win{
  border-color:rgba(124,219,142,0.4);
  background:linear-gradient(180deg, rgba(124,219,142,0.06), var(--bg-1));
}
.insight.note{
  border-color:rgba(242,219,130,0.4);
  background:linear-gradient(180deg, rgba(242,219,130,0.06), var(--bg-1));
}
.insight-tag{
  font-family:var(--font-display);
  font-size:10px;
  letter-spacing:0.2em;
  text-transform:uppercase;
  margin-bottom:14px;
}
.insight.urgent .insight-tag{color:var(--bad)}
.insight.win .insight-tag{color:var(--good)}
.insight.note .insight-tag{color:var(--brand-accent)}
.insight-title{
  font-size:18px; font-weight:700;
  letter-spacing:-0.02em; line-height:1.3;
  margin-bottom:8px;
}
.insight-body{
  font-size:14px;
  color:var(--fg-3);
  line-height:1.5;
}
.insight-cta{
  display:inline-block; margin-top:14px;
  font-size:13px; font-weight:600;
  color:var(--brand-accent);
  letter-spacing:-0.01em;
  border-bottom:1px solid rgba(242,219,130,0.4);
  padding-bottom:1px;
  cursor:pointer;
}

/* === ROP SAYS === */
.rop-says{
  background:var(--bg-1);
  border:1px solid var(--border-1);
  border-left:3px solid var(--brand-accent);
  border-radius:var(--r-md);
  padding:28px 32px;
  margin-bottom:48px;
  display:flex; gap:24px; align-items:flex-start;
}
.rop-says-avatar{
  width:48px; height:48px; flex-shrink:0;
  background:var(--brand-accent);
  border-radius:12px;
  display:flex; align-items:center; justify-content:center;
  color:var(--fg-invert);
  font-weight:900; font-size:22px;
}
.rop-says-content{flex:1}
.rop-says-label{
  font-family:var(--font-display);
  font-size:10px;
  letter-spacing:0.2em;
  text-transform:uppercase;
  color:var(--brand-accent);
  margin-bottom:6px;
}
.rop-says-text{
  font-size:18px;
  line-height:1.5;
  color:var(--fg-1);
  letter-spacing:-0.02em;
  font-weight:500;
}
.rop-says-text strong{color:var(--brand-accent); font-weight:700}

/* === KPI ROW === */
.kpi-row{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:16px;
  margin-bottom:48px;
}
.kpi{
  background:var(--bg-1);
  border:1px solid var(--border-1);
  border-radius:var(--r-md);
  padding:28px;
}
.kpi-label{
  font-family:var(--font-display);
  font-size:10px;
  letter-spacing:0.2em;
  text-transform:uppercase;
  color:var(--fg-3);
  margin-bottom:14px;
}
.kpi-value{
  font-family:var(--font-sans);
  font-weight:700;
  font-size:48px;
  letter-spacing:-0.04em;
  line-height:1;
  color:var(--fg-1);
}
.kpi-value .unit{
  font-size:18px;
  color:var(--fg-3);
  font-weight:500;
  margin-left:4px;
  letter-spacing:0;
}
.kpi-delta{
  margin-top:10px;
  font-family:var(--font-mono);
  font-size:13px;
  display:flex; align-items:center; gap:6px;
}
.kpi-delta.up{color:var(--good)}
.kpi-delta.down{color:var(--bad)}
.kpi-delta.flat{color:var(--fg-3)}

/* === SECTION === */
.section{margin-bottom:48px}
.section-h{
  display:flex; justify-content:space-between; align-items:flex-end;
  margin-bottom:24px;
}
.section-h h2{
  font-family:var(--font-sans);
  font-weight:700;
  font-size:32px;
  letter-spacing:-0.03em;
  line-height:1;
}
.section-h .meta{
  font-family:var(--font-mono);
  font-size:13px;
  color:var(--fg-3);
}

/* === TWO COL === */
.two-col{
  display:grid;
  grid-template-columns:1.4fr 1fr;
  gap:16px;
}
@media (max-width:1100px){
  .two-col{grid-template-columns:1fr}
  .insights{grid-template-columns:1fr}
  .kpi-row{grid-template-columns:repeat(2,1fr)}
}

/* === CARD === */
.card{
  background:var(--bg-1);
  border:1px solid var(--border-1);
  border-radius:var(--r-md);
  padding:28px;
}
.card-h{
  display:flex; justify-content:space-between; align-items:flex-end;
  margin-bottom:24px;
}
.card-h h3{
  font-size:20px; font-weight:700;
  letter-spacing:-0.02em;
}
.card-h .meta{font-family:var(--font-mono); font-size:12px; color:var(--fg-3)}

/* === DONUT === */
.donut-wrap{
  display:flex; align-items:center; gap:32px;
  flex-wrap:wrap;
}
.donut{position:relative; width:240px; height:240px; flex-shrink:0}
.donut-center{
  position:absolute; inset:0;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  text-align:center;
}
.donut-center .num{
  font-family:var(--font-sans);
  font-weight:700;
  font-size:64px;
  letter-spacing:-0.04em;
  line-height:1;
  color:var(--brand-accent);
}
.donut-center .lbl{
  font-family:var(--font-display);
  font-size:10px;
  letter-spacing:0.2em;
  text-transform:uppercase;
  color:var(--fg-3);
  margin-top:6px;
}
.donut-legend{flex:1; min-width:200px}
.donut-legend-item{
  display:flex; justify-content:space-between; align-items:center;
  padding:12px 0;
  border-bottom:1px solid var(--border-1);
  font-size:14px;
}
.donut-legend-item:last-child{border-bottom:none}
.donut-legend-name{display:flex; align-items:center; gap:10px; color:var(--fg-2); font-weight:500}
.donut-dot{width:10px; height:10px; border-radius:50%}
.donut-legend-val{font-family:var(--font-mono); font-weight:600; color:var(--fg-1)}

/* === MANAGER GRID === */
.mgr-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(280px, 1fr));
  gap:16px;
}
.mgr-card{
  background:var(--bg-1);
  border:1px solid var(--border-1);
  border-radius:var(--r-md);
  padding:24px;
  cursor:pointer;
  transition:all 240ms var(--ease-out);
  position:relative;
  overflow:hidden;
}
.mgr-card:hover{
  transform:translateY(-3px);
  border-color:var(--border-2);
  background:var(--bg-2);
}
.mgr-card-h{display:flex; align-items:center; gap:14px; margin-bottom:24px}
.mgr-avatar{
  width:48px; height:48px;
  border-radius:12px;
  background:var(--bg-3);
  display:flex; align-items:center; justify-content:center;
  font-weight:700; font-size:18px;
  letter-spacing:-0.02em;
  color:var(--fg-1);
  flex-shrink:0;
}
.mgr-avatar.top{background:var(--brand-accent); color:var(--fg-invert)}
.mgr-name{font-size:16px; font-weight:700; letter-spacing:-0.02em; line-height:1.2}
.mgr-role{font-family:var(--font-mono); font-size:11px; color:var(--fg-3); margin-top:2px}
.mgr-score-row{
  display:flex; justify-content:space-between; align-items:flex-end;
  margin-bottom:14px;
}
.mgr-score{
  font-family:var(--font-sans);
  font-weight:700;
  font-size:48px;
  letter-spacing:-0.04em;
  line-height:1;
}
.mgr-score.good{color:var(--good)}
.mgr-score.warn{color:var(--brand-accent)}
.mgr-score.bad{color:var(--bad)}
.mgr-stats{
  font-family:var(--font-mono);
  font-size:12px;
  color:var(--fg-3);
  text-align:right;
  line-height:1.5;
}
.mgr-spark{height:40px; margin-top:8px}
.mgr-foot{
  display:flex; justify-content:space-between;
  margin-top:14px; padding-top:14px;
  border-top:1px solid var(--border-1);
  font-family:var(--font-mono);
  font-size:11px;
}
.mgr-foot div{color:var(--fg-3)}
.mgr-foot strong{color:var(--fg-1); font-weight:600}

/* === BACK BTN === */
.back-btn{
  display:inline-flex; align-items:center; gap:8px;
  font-size:13px; font-weight:600;
  color:var(--fg-3);
  letter-spacing:-0.01em;
  margin-bottom:24px;
  transition:color 200ms;
}
.back-btn:hover{color:var(--brand-accent)}
.back-btn svg{width:16px; height:16px}

/* === MANAGER DETAIL === */
.mgr-detail-h{
  display:flex; align-items:center; gap:24px;
  margin-bottom:48px;
  padding-bottom:32px;
  border-bottom:1px solid var(--border-1);
}
.mgr-detail-avatar{
  width:96px; height:96px;
  border-radius:24px;
  background:var(--brand-accent);
  display:flex; align-items:center; justify-content:center;
  font-weight:700; font-size:36px;
  letter-spacing:-0.04em;
  color:var(--fg-invert);
  flex-shrink:0;
}
.mgr-detail-meta{flex:1}
.mgr-detail-meta h1{
  font-size:48px; font-weight:700;
  letter-spacing:-0.04em; line-height:1;
}
.mgr-detail-meta .role{
  font-family:var(--font-mono);
  font-size:14px;
  color:var(--fg-3);
  margin-top:8px;
}
.mgr-detail-score{
  text-align:right;
}
.mgr-detail-score .num{
  font-size:80px; font-weight:700;
  letter-spacing:-0.05em; line-height:1;
}
.mgr-detail-score .lbl{
  font-family:var(--font-display);
  font-size:11px; letter-spacing:0.2em;
  color:var(--fg-3);
  text-transform:uppercase;
  margin-top:6px;
}

/* === LINE CHART === */
.line-chart{width:100%; height:280px}
.chart-grid line{stroke:var(--border-1); stroke-dasharray:2 4}
.chart-axis text{
  font-family:var(--font-mono);
  font-size:10px;
  fill:var(--fg-4);
}
.chart-line{fill:none; stroke:var(--brand-accent); stroke-width:2.5; stroke-linejoin:round; stroke-linecap:round}
.chart-area{fill:url(#area-grad)}
.chart-dot{fill:var(--brand-accent); stroke:var(--bg-1); stroke-width:2}

/* === RADAR === */
.radar{width:100%; max-width:380px; aspect-ratio:1}
.radar-grid{stroke:var(--border-1); fill:none}
.radar-grid-axis{stroke:var(--border-1)}
.radar-shape{fill:rgba(242,219,130,0.18); stroke:var(--brand-accent); stroke-width:2; stroke-linejoin:round}
.radar-dot{fill:var(--brand-accent)}
.radar-label{
  font-family:var(--font-display);
  font-size:10px;
  letter-spacing:0.18em;
  text-transform:uppercase;
  fill:var(--fg-3);
}
.radar-val{
  font-family:var(--font-mono);
  font-size:11px;
  fill:var(--fg-1);
  font-weight:600;
}

/* === CALL LIST === */
.call-list{display:flex; flex-direction:column; gap:8px}
.call-row{
  display:grid;
  grid-template-columns: 64px 1fr 80px 100px 80px 28px;
  align-items:center;
  gap:16px;
  padding:18px 20px;
  background:var(--bg-1);
  border:1px solid var(--border-1);
  border-radius:var(--r-sm);
  cursor:pointer;
  transition:all 200ms var(--ease-out);
}
.call-row:hover{
  border-color:var(--border-2);
  background:var(--bg-2);
  transform:translateX(2px);
}
.call-time{
  font-family:var(--font-mono);
  font-size:13px;
  color:var(--fg-3);
}
.call-client{
  font-size:14px;
  font-weight:500;
}
.call-client .topic{
  display:block;
  font-size:12px;
  color:var(--fg-3);
  margin-top:2px;
  font-weight:400;
}
.call-dur{
  font-family:var(--font-mono);
  font-size:12px;
  color:var(--fg-3);
}
.call-result{
  font-family:var(--font-display);
  font-size:10px;
  letter-spacing:0.16em;
  text-transform:uppercase;
  padding:6px 10px;
  border-radius:var(--r-xl);
  text-align:center;
  white-space:nowrap;
}
.call-result.win{background:rgba(124,219,142,0.14); color:var(--good)}
.call-result.lost{background:rgba(229,91,91,0.14); color:var(--bad)}
.call-result.next{background:rgba(242,219,130,0.14); color:var(--brand-accent)}
.call-score{
  font-family:var(--font-mono);
  font-weight:700;
  font-size:14px;
  text-align:right;
}
.call-score.good{color:var(--good)}
.call-score.warn{color:var(--brand-accent)}
.call-score.bad{color:var(--bad)}
.call-arrow{color:var(--fg-4); justify-self:end}

/* === CALL DETAIL === */
.call-detail-h{
  display:grid;
  grid-template-columns:auto 1fr auto;
  gap:32px;
  align-items:flex-end;
  margin-bottom:32px;
  padding-bottom:24px;
  border-bottom:1px solid var(--border-1);
}
.call-detail-h h1{
  font-size:40px; font-weight:700;
  letter-spacing:-0.04em; line-height:1;
}
.call-detail-h .meta{
  font-family:var(--font-mono);
  font-size:13px;
  color:var(--fg-3);
  margin-top:10px;
  line-height:1.6;
}
.call-tags{display:flex; gap:8px; align-items:center}
.tag-result{
  font-family:var(--font-display);
  font-size:11px;
  letter-spacing:0.16em;
  text-transform:uppercase;
  padding:8px 14px;
  border-radius:var(--r-xl);
}
.tag-result.win{background:rgba(124,219,142,0.16); color:var(--good)}
.tag-result.lost{background:rgba(229,91,91,0.16); color:var(--bad)}
.tag-result.next{background:rgba(242,219,130,0.16); color:var(--brand-accent)}

/* === SCORES STRIP === */
.scores-strip{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:12px;
  margin-bottom:32px;
}
.score-cell{
  background:var(--bg-1);
  border:1px solid var(--border-1);
  border-radius:var(--r-sm);
  padding:18px 20px;
}
.score-cell .lbl{
  font-family:var(--font-display);
  font-size:10px;
  letter-spacing:0.18em;
  text-transform:uppercase;
  color:var(--fg-3);
  margin-bottom:10px;
}
.score-cell .num{
  font-family:var(--font-mono);
  font-weight:600;
  font-size:24px;
  letter-spacing:-0.02em;
}
.score-cell .num.good{color:var(--good)}
.score-cell .num.warn{color:var(--brand-accent)}
.score-cell .num.bad{color:var(--bad)}
.score-cell .bar{
  margin-top:10px;
  height:4px;
  background:var(--bg-3);
  border-radius:2px;
  overflow:hidden;
}
.score-cell .bar-fill{
  height:100%;
  background:var(--brand-accent);
  border-radius:2px;
  transition:width 600ms var(--ease-out);
}
.score-cell .bar-fill.good{background:var(--good)}
.score-cell .bar-fill.bad{background:var(--bad)}

/* === TRANSCRIPT === */
.transcript-grid{
  display:grid;
  grid-template-columns:1.5fr 1fr;
  gap:16px;
}

  .transcript-grid{grid-template-columns:1fr}
  .scores-strip{grid-template-columns:repeat(2,1fr)}
}
.transcript{
  background:var(--bg-1);
  border:1px solid var(--border-1);
  border-radius:var(--r-md);
  padding:32px;
  max-height:780px;
  overflow-y:auto;
}
.transcript-line{
  display:grid;
  grid-template-columns:80px 1fr;
  gap:18px;
  padding:14px 0;
  font-size:15px;
  line-height:1.6;
  border-bottom:1px solid var(--border-1);
}
.transcript-line:last-child{border-bottom:none}
.transcript-who{
  font-family:var(--font-mono);
  font-size:11px;
  letter-spacing:0.06em;
  text-transform:uppercase;
  color:var(--fg-3);
  padding-top:3px;
}
.transcript-who.mgr{color:var(--brand-accent)}
.transcript-text{color:var(--fg-2)}
.transcript-line.flag-bad{
  background:rgba(229,91,91,0.06);
  margin:0 -16px;
  padding:14px 16px;
  border-radius:8px;
  border-left:2px solid var(--bad);
  border-bottom-color:transparent;
}
.transcript-line.flag-good{
  background:rgba(124,219,142,0.06);
  margin:0 -16px;
  padding:14px 16px;
  border-radius:8px;
  border-left:2px solid var(--good);
  border-bottom-color:transparent;
}
.transcript-flag{
  font-family:var(--font-display);
  font-size:10px;
  letter-spacing:0.18em;
  text-transform:uppercase;
  margin-top:6px;
  display:inline-block;
}
.transcript-flag.bad{color:var(--bad)}
.transcript-flag.good{color:var(--good)}

/* === ANALYSIS PANEL === */
.analysis{
  background:var(--bg-1);
  border:1px solid var(--border-1);
  border-radius:var(--r-md);

}

}
.analysis li.bad::before{background:var(--bad)}
.analysis li.good::before{background:var(--good)}

/* === SCROLLBAR === */
::-webkit-scrollbar{width:8px; height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bg-3); border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:var(--fg-4)}

/* === FADE IN / VIEW TRANSITIONS === */
.fade-in{animation:fadeIn 520ms var(--ease-out) both}
@keyframes fadeIn{
  from{opacity:0; transform:translateY(12px)}
  to{opacity:1; transform:translateY(0)}
}
.stagger > *{
  animation:staggerIn 600ms var(--ease-out) both;
  opacity:0;
}
@keyframes staggerIn{
  from{opacity:0; transform:translateY(16px)}
  to{opacity:1; transform:translateY(0)}
}
.stagger > *:nth-child(1){animation-delay:60ms}
.stagger > *:nth-child(2){animation-delay:140ms}
.stagger > *:nth-child(3){animation-delay:220ms}
.stagger > *:nth-child(4){animation-delay:300ms}
.stagger > *:nth-child(5){animation-delay:380ms}
.stagger > *:nth-child(6){animation-delay:460ms}
.stagger > *:nth-child(7){animation-delay:540ms}
.stagger > *:nth-child(8){animation-delay:620ms}

/* Reveal on scroll */
.reveal{
  opacity:0;
  transform:translateY(24px);
  transition:opacity 700ms var(--ease-out), transform 700ms var(--ease-out);
  will-change:opacity, transform;
}
.reveal.in{opacity:1; transform:translateY(0)}

/* Soft hover lift on cards */
.kpi, .insight, .card{
  transition:transform 320ms var(--ease-out), border-color 280ms var(--ease-out), background 280ms var(--ease-out), box-shadow 320ms var(--ease-out);
  will-change:transform;
}
.kpi:hover{
  transform:translateY(-2px);
  border-color:var(--border-2);
  box-shadow:0 18px 40px -22px rgba(0,0,0,.6);
}
.card:hover{border-color:var(--border-2)}

/* Pulse for urgent insight tag */
@keyframes softPulse{
  0%,100%{opacity:1}
  50%{opacity:.55}
}
.insight.urgent .insight-tag{animation:softPulse 2.4s ease-in-out infinite}

/* Bar fill grow */
.bar-fill{animation:barGrow 900ms var(--ease-out) both}
@keyframes barGrow{from{width:0 !important}}

/* Donut stroke draw */
@keyframes drawDash{
  from{stroke-dashoffset:1000}
}
.donut svg circle:not(:first-child){
  animation:drawDash 1200ms var(--ease-out) both;
}

/* Line chart path draw */
.chart-line{
  stroke-dasharray:2000;
  animation:lineDraw 1400ms var(--ease-out) both;
}
@keyframes lineDraw{
  from{stroke-dashoffset:2000}
  to{stroke-dashoffset:0}
}
.chart-area{
  animation:fadeIn 1200ms var(--ease-out) 600ms both;
}
.chart-dot{
  animation:fadeIn 400ms var(--ease-out) both;
  transform-origin:center;
}
.chart-dot:nth-child(odd){animation-delay:1100ms}
.chart-dot:nth-child(even){animation-delay:1300ms}

/* Radar appearance */
.radar-shape{
  transform-origin:center;
  animation:radarPop 900ms var(--ease-out) 200ms both;
}
@keyframes radarPop{
  from{transform:scale(0.4); opacity:0}
  to{transform:scale(1); opacity:1}
}
.radar-dot{
  animation:fadeIn 400ms var(--ease-out) 800ms both;
}

/* Sparkline draw */
.mgr-spark path{
  stroke-dasharray:600;
  animation:lineDraw 1200ms var(--ease-out) both;
}

/* Page heading rise */
.page-h h1{
  animation:headingRise 700ms var(--ease-out) both;
}
@keyframes headingRise{
  from{opacity:0; transform:translateY(20px); letter-spacing:-0.07em}
  to{opacity:1; transform:translateY(0); letter-spacing:-0.05em}
}

/* Number counter target */
.kpi-value, .donut-center .num, .mgr-detail-score .num, .mgr-score{
  font-variant-numeric:tabular-nums;
}

/* Smooth row entry */
.call-row{
  animation:rowSlide 500ms var(--ease-out) both;
}
@keyframes rowSlide{
  from{opacity:0; transform:translateX(-12px)}
  to{opacity:1; transform:translateX(0)}
}
.call-list .call-row:nth-child(1){animation-delay:40ms}
.call-list .call-row:nth-child(2){animation-delay:90ms}
.call-list .call-row:nth-child(3){animation-delay:140ms}
.call-list .call-row:nth-child(4){animation-delay:190ms}
.call-list .call-row:nth-child(5){animation-delay:240ms}
.call-list .call-row:nth-child(6){animation-delay:290ms}
.call-list .call-row:nth-child(7){animation-delay:340ms}
.call-list .call-row:nth-child(8){animation-delay:390ms}

/* Transcript line entry */
.transcript-line{
  animation:lineFade 500ms var(--ease-out) both;
}
@keyframes lineFade{
  from{opacity:0; transform:translateY(6px)}
  to{opacity:1; transform:translateY(0)}
}
.transcript-line:nth-child(1){animation-delay:80ms}
.transcript-line:nth-child(2){animation-delay:140ms}
.transcript-line:nth-child(3){animation-delay:200ms}
.transcript-line:nth-child(4){animation-delay:260ms}
.transcript-line:nth-child(5){animation-delay:320ms}
.transcript-line:nth-child(n+6){animation-delay:380ms}

/* Period tab indicator slide */
.nav-period button{position:relative; z-index:1}
.nav-period button.active{
  box-shadow:0 8px 22px -8px rgba(242,219,130,.5);
}

/* Score number countup baseline */
.count-up{display:inline-block}

/* Smooth hash navigation */
html{scroll-behavior:smooth}

/* Reduced motion fallback */
@media (prefers-reduced-motion:reduce){
  *, *::before, *::after{
    animation-duration:.01ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.01ms !important;
    scroll-behavior:auto !important;
  }
}

/* For each manager: scores per period (script, objection, empathy, need, close)
   + daily timeseries (30 points), call counts, deal sums */

function seedRand(seed){
  let s = seed;
  return () => { s = (s * 9301 + 49297) % 233280; return s/233280; };
}

function genTimeseries(rand, base, vol){
  const arr=[];
  let v = base;
  for(let i=0;i<30;i++){
    v += (rand()-0.5)*vol;
    v = Math.max(35, Math.min(98, v));
    arr.push(Math.round(v));
  }
  return arr;
}

const views = {
  overview: document.getElementById('view-overview'),
  manager:  document.getElementById('view-manager'),
  call:     document.getElementById('view-call'),
};

function show(view){
  Object.values(views).forEach(v => v.hidden = true);
  views[view].hidden = false;
  views[view].classList.remove('fade-in');
  void views[view].offsetWidth;
  views[view].classList.add('fade-in');
  window.scrollTo({top:0, behavior:'instant'});
  requestAnimationFrame(() => {
    setupReveal();
    runCountUps();
  });
}

/* Scroll reveal */
let revealObserver = null;
function setupReveal(){
  if(revealObserver) revealObserver.disconnect();
  const els = document.querySelectorAll('.section, .two-col');
  els.forEach(e => e.classList.add('reveal'));
  revealObserver = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      if(e.isIntersecting){
        e.target.classList.add('in');
        revealObserver.unobserve(e.target);
      }
    });
  }, {threshold: 0.08, rootMargin:'0px 0px -40px 0px'});
  els.forEach(e => revealObserver.observe(e));
}

/* Count-up animation for big numbers */
function runCountUps(){
  const targets = document.querySelectorAll('[data-count]');
  targets.forEach(el => {
    const final = parseFloat(el.dataset.count);
    const suffix = el.dataset.suffix || '';
    const decimals = el.dataset.decimals ? parseInt(el.dataset.decimals) : 0;
    const dur = 900;
    const start = performance.now();
    function tick(now){
      const t = Math.min(1, (now - start) / dur);
      const eased = 1 - Math.pow(1 - t, 3);
      const v = final * eased;
      el.textContent = (decimals > 0 ? v.toFixed(decimals) : Math.round(v)) + suffix;
      if(t < 1) requestAnimationFrame(tick);
      else el.textContent = (decimals > 0 ? final.toFixed(decimals) : final) + suffix;
    }
    requestAnimationFrame(tick);
  });
}

function navigate(hash){
  const h = (hash || location.hash || '#/').replace(/^#/,'');
  if(h === '/' || h === ''){ renderOverview(); show('overview'); return; }
  const [, type, id] = h.split('/');
  if(type === 'manager' && id){ renderManager(id); show('manager'); return; }
  if(type === 'call' && id){ renderCall(id); show('call'); return; }
  renderOverview(); show('overview');
}

window.addEventListener('hashchange', () => navigate());

function avgScore(scores){
  return Math.round(scores.reduce((a,b)=>a+b,0)/scores.length);
}
function scoreClass(s){
  if(s>=80) return 'good';
  if(s>=70) return 'warn';
  return 'bad';
}
function fmtMoney(n){
  if(n >= 1000000) return (n/1000000).toFixed(1).replace('.0','')+'M ₽';
  if(n >= 1000) return Math.round(n/1000)+'К ₽';
  return n+' ₽';
}
function periodLabel(p){
  return {day:'СЕГОДНЯ',week:'ЭТА НЕДЕЛЯ',month:'ЭТОТ МЕСЯЦ',quarter:'ЭТОТ КВАРТАЛ'}[p];
}

      </div>
    `}
  `;
}

function donutSvg(data, centerVal){
  const r = 100, cx=120, cy=120, sw=24;
  const total = data.reduce((a,d)=>a+d.val,0);
  let acc = 0;
  const segments = data.map(d => {
    const fr = d.val/total;
    const len = 2*Math.PI*r;
    const dash = `${fr*len} ${len}`;
    const offset = -acc * len;
    acc += fr;
    return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${d.color}" stroke-width="${sw}" stroke-dasharray="${dash}" stroke-dashoffset="${offset}" transform="rotate(-90 ${cx} ${cy})" stroke-linecap="butt"/>`;
  }).join('');
  return `
    <div class="donut">
      <svg viewBox="0 0 240 240" width="240" height="240">
        <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--bg-2)" stroke-width="${sw}"/>
        ${segments}
      </svg>
      <div class="donut-center">
        <div class="num"><span data-count="${centerVal}">0</span></div>
        <div class="lbl">Скор команды</div>
      </div>
    </div>
  `;
}

function radarSvg(items){
  const cx=190, cy=190, r=140;
  const n = items.length;
  // grid rings
  const rings = [0.25, 0.5, 0.75, 1].map(rr => {
    const pts = items.map((_,i) => {
      const a = -Math.PI/2 + i*2*Math.PI/n;
      return `${cx + r*rr*Math.cos(a)},${cy + r*rr*Math.sin(a)}`;
    }).join(' ');
    return `<polygon class="radar-grid" points="${pts}"/>`;
  }).join('');
  // axes
  const axes = items.map((_,i) => {
    const a = -Math.PI/2 + i*2*Math.PI/n;
    return `<line class="radar-grid-axis" x1="${cx}" y1="${cy}" x2="${cx + r*Math.cos(a)}" y2="${cy + r*Math.sin(a)}"/>`;
  }).join('');
  // shape
  const pts = items.map((it,i) => {
    const a = -Math.PI/2 + i*2*Math.PI/n;
    const rr = r * (it.val/100);
    return `${cx + rr*Math.cos(a)},${cy + rr*Math.sin(a)}`;
  }).join(' ');
  // dots
  const dots = items.map((it,i) => {
    const a = -Math.PI/2 + i*2*Math.PI/n;
    const rr = r * (it.val/100);
    return `<circle class="radar-dot" cx="${cx + rr*Math.cos(a)}" cy="${cy + rr*Math.sin(a)}" r="4"/>`;
  }).join('');
  // labels
  const labels = items.map((it,i) => {
    const a = -Math.PI/2 + i*2*Math.PI/n;
    const lr = r + 24;
    const x = cx + lr*Math.cos(a);
    const y = cy + lr*Math.sin(a);
    const ta = Math.abs(Math.cos(a)) < 0.2 ? 'middle' : (Math.cos(a) > 0 ? 'start' : 'end');
    return `
      <text class="radar-label" x="${x}" y="${y}" text-anchor="${ta}" alignment-baseline="middle">${it.label}</text>
      <text class="radar-val" x="${x}" y="${y+14}" text-anchor="${ta}" alignment-baseline="middle">${it.val}</text>
    `;
  }).join('');
  return `
    <svg class="radar" viewBox="0 0 380 380">
      ${rings}
      ${axes}
      <polygon class="radar-shape" points="${pts}"/>
      ${dots}
      ${labels}
    </svg>
  `;
}

function lineChartSvg(data){
  const w=720, h=260, pad={t:20,r:24,b:36,l:32};
  const W = w - pad.l - pad.r;
  const H = h - pad.t - pad.b;
  const min = 30, max = 100;
  const xs = data.map((_,i) => pad.l + (i/(data.length-1))*W);
  const ys = data.map(v => pad.t + H - ((v-min)/(max-min))*H);
  const linePath = xs.map((x,i) => (i===0?'M':'L')+x+','+ys[i]).join(' ');
  const areaPath = linePath + ` L ${xs[xs.length-1]} ${pad.t+H} L ${xs[0]} ${pad.t+H} Z`;
  const gridLines = [40, 60, 80, 100].map(v => {
    const y = pad.t + H - ((v-min)/(max-min))*H;
    return `
      <line class="chart-grid" x1="${pad.l}" y1="${y}" x2="${pad.l+W}" y2="${y}"/>
      <text class="chart-axis" x="${pad.l-8}" y="${y+3}" text-anchor="end">${v}</text>
    `;
  }).join('');
  const dots = xs.map((x,i) => (i%5===0 || i===xs.length-1) ? `<circle class="chart-dot" cx="${x}" cy="${ys[i]}" r="4"/>` : '').join('');
  // x labels - days ago
  const xLabels = [0, 7, 14, 21, 29].map(i => `<text class="chart-axis" x="${xs[i]}" y="${pad.t+H+18}" text-anchor="middle">−${29-i}д</text>`).join('');
  return `
    <svg class="line-chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
      <defs>
        <linearGradient id="area-grad" x1="0" x2="0" y1="0" y2="1">
          <stop offset="0%" stop-color="#F2DB82" stop-opacity="0.28"/>
          <stop offset="100%" stop-color="#F2DB82" stop-opacity="0"/>
        </linearGradient>
      </defs>
      ${gridLines}
      <path class="chart-area" d="${areaPath}"/>
      <path class="chart-line" d="${linePath}"/>
      ${dots}
      ${xLabels}
    </svg>
  `;
}

function sparklineSvg(data, cls){
  const w=240, h=40, pad=4;
  const W = w - pad*2, H = h - pad*2;
  const min = Math.min(...data), max = Math.max(...data);
  const range = Math.max(max-min, 10);
  const xs = data.map((_,i) => pad + (i/(data.length-1))*W);
  const ys = data.map(v => pad + H - ((v-min)/range)*H);
  const path = xs.map((x,i) => (i===0?'M':'L')+x+','+ys[i]).join(' ');
  const colorMap = {good:'#7CDB8E', warn:'#F2DB82', bad:'#E55B5B'};
  const color = colorMap[cls] || '#F2DB82';
  return `
    <svg class="mgr-spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
      <path d="${path}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  `;
}

function updateEvaluateBtn(){
  const btn = document.getElementById('btn-evaluate');
  if(!btn) return;
  const text = recordingState.selectedTab === 'record' ? recordingState.finalText : recordingState.pastedText;
  btn.disabled = !text || text.trim().length < 30;
}

function toggleRecording(){
  if(recordingState.isRecording){
    if(recognition) recognition.stop();
    return;
  }
  startRecording();
}

function startRecording(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SR();
  recognition.lang = 'ru-RU';
  recognition.continuous = true;
  recognition.interimResults = true;

  recognition.onstart = () => {
    recordingState.isRecording = true;
    recordingState.startTime = Date.now();
    recordingState.timerId = setInterval(updateTimer, 200);
    updateRecordUI();
  };

  recognition.onresult = (e) => {
    let interim = '';
    for(let i = e.resultIndex; i < e.results.length; i++){
      const transcript = e.results[i][0].transcript;
      if(e.results[i].isFinal){
        recordingState.finalText += transcript + ' ';
      } else {
        interim += transcript;
      }
    }
    recordingState.interimText = interim;
    updateTranscriptUI();
    updateEvaluateBtn();
  };

  recognition.onerror = (e) => {
    console.warn('Speech error:', e.error);
    if(e.error === 'no-speech') return;
    showError('Ошибка распознавания: ' + e.error);
  };

  recognition.onend = () => {
    recordingState.isRecording = false;
    if(recordingState.timerId) clearInterval(recordingState.timerId);
    recordingState.interimText = '';
    updateRecordUI();
    updateTranscriptUI();
    updateEvaluateBtn();
  };

  try{
    recognition.start();
  } catch(err){
    showError('Не удалось запустить запись: ' + err.message);
  }
}

function updateTimer(){
  const el = document.getElementById('record-timer');
  if(!el) return;
  const sec = Math.floor((Date.now() - recordingState.startTime)/1000);
  const mm = String(Math.floor(sec/60)).padStart(2,'0');
  const ss = String(sec%60).padStart(2,'0');
  el.textContent = `${mm}:${ss}`;
}

function updateRecordUI(){
  const btn = document.getElementById('record-btn');
  const status = document.getElementById('record-status');
  if(!btn) return;
  btn.classList.toggle('recording', recordingState.isRecording);
  if(status){

async function evaluateCall(){
  const text = (recordingState.selectedTab === 'record' ? recordingState.finalText : recordingState.pastedText).trim();
  if(text.length < 30){ showError('Слишком короткий текст. Минимум 30 символов.'); return; }

  const mgrId = recordingState.selectedManager;
  const client = (document.getElementById('client-input')?.value || 'Без имени').trim() || 'Без имени';
  const topic = (document.getElementById('topic-input')?.value || 'Без темы').trim() || 'Без темы';
  const m = MANAGERS.find(x => x.id === mgrId);

  const dur = recordingState.selectedTab === 'record'
    ? Math.max(1, Math.floor((Date.now() - recordingState.startTime)/60000))
    : Math.max(1, Math.round(text.length / 600));

  showAILoading();

  await new Promise(r => setTimeout(r, 4200 + Math.random()*1800));
  const result = scoreLocally(text, m);
  addNewCall(result, text, mgrId, client, topic, dur);
}

function scoreLocally(text, m){
  const t = text.toLowerCase();
  const tier = m.tier;
  const baseFloor = tier === 'top' ? 78 : tier === 'jun' ? 55 : 66;

  const has = arr => arr.some(w => t.includes(w));
  const count = arr => arr.reduce((a,w) => a + (t.match(new RegExp(w,'g'))||[]).length, 0);

  const questionMarks = (text.match(/\?/g)||[]).length;
  const len = text.length;

  // Heuristics
  const empathySignals = count(['понимаю','слышу','представляю','знаю как','давайте','здравствуйте','рад','приятно','спасибо']);
  const objectionSignals = count(['дорого','цена','стоит','подумаю','посоветуюсь','рассрочка','скидка','бюджет','не подходит']);
  const closeSignals = count(['оплат','ссылк','договор','встретимся','пятниц','до конца','следующ','давайте сделаем','зафиксируем']);
  const needSignals = count(['чем занимаетесь','какая задача','что не устраивает','зачем','хотите','цель','боль','проблема','результат']) + Math.min(questionMarks, 8);
  const scriptSignals = count(['здравствуйте','меня зовут','оставляли заявку','удобно','30 минут','рассказать','предложить']);

  const norm = (v, max) => Math.min(1, v/max);

  const empathy = Math.round(baseFloor + norm(empathySignals,5)*22 + (Math.random()-0.5)*6);
  const objection = Math.round(baseFloor + norm(objectionSignals,4)*20 + (Math.random()-0.5)*6);
  const close = Math.round(baseFloor + norm(closeSignals,4)*22 + (Math.random()-0.5)*6);
  const need = Math.round(baseFloor + norm(needSignals,12)*20 + (Math.random()-0.5)*6);
  const script = Math.round(baseFloor + norm(scriptSignals,4)*18 + (Math.random()-0.5)*6);

  const clamp = v => Math.max(35, Math.min(98, v));
  const sc = [script, objection, empathy, need, close].map(clamp);
  const avg = Math.round(sc.reduce((a,b)=>a+b,0)/5);

  let result = 'next';
  if(avg >= 82 && closeSignals >= 2) result = 'win';
  else if(avg < 65) result = 'lost';

  // Pull a few sentences for flag candidates
  const sentences = text.split(/(?<=[.!?])\s+/).filter(s => s.trim().length > 12);
  const flags = [];
  if(sentences.length){
    const goodIdx = Math.floor(sentences.length * 0.3);
    const badIdx = Math.floor(sentences.length * 0.7);
    if(empathy >= 78 && sentences[goodIdx]){
      flags.push({phrase: sentences[goodIdx].slice(0,60), type:'good', reason:'Тёплый контакт с клиентом'});
    }
    if(objection < 70 && sentences[badIdx]){
      flags.push({phrase: sentences[badIdx].slice(0,60), type:'bad', reason:'Слабая отработка возражения'});
    }
    if(close >= 80 && sentences[sentences.length-1]){
      flags.push({phrase: sentences[sentences.length-1].slice(0,60), type:'good', reason:'Чёткое закрытие на следующий шаг'});
    }
  }

  // Compose qualitative content
  const summaries = {
    win: `Звонок прошёл сильно. ${m.name.split(' ')[0]} выявил(а) потребность, обработал(а) ключевое возражение и закрыл(а) на оплату. Скор ${avg} - в зелёной зоне.`,
    next: `Звонок отработан стабильно. Клиент не закрыт на оплату, но согласован следующий шаг. Скор ${avg} - есть зоны для роста.`,
    lost: `Лид потерян. ${m.name.split(' ')[0]} не справился(ась) с возражением и не зафиксировал(а) следующий шаг. Скор ${avg} - требуется разбор с РОПом.`,
  };
  const prosBank = {
    high:[
      'Хорошее открытие звонка - быстро установлен контакт',
      'Грамотное выявление потребности через вопросы',
      'Использование социального доказательства и кейсов',
      'Чёткое закрытие на следующий шаг с дедлайном',
      'Эмпатичный тон без давления',
    ],
    low:[
      'Сохранён доброжелательный тон при сложном клиенте',
      'Открытые вопросы в начале диалога',
      'Не было прямого впаривания',
    ]
  };
  const consBank = {
    objection:'Возражение про цену проработано слабо - нужно больше аргументации через ROI',
    need:'Не до конца выявлена истинная потребность клиента',
    close:'Финальное закрытие размыто - нет конкретного дедлайна или CTA',
    empathy:'Местами слишком формальный тон',
    script:'Структура звонка нарушена - часть скрипта пропущена',
  };

  const pros = avg >= 75 ? prosBank.high.sort(()=>Math.random()-0.5).slice(0,3) : prosBank.low.sort(()=>Math.random()-0.5).slice(0,2);
  const cons = [];
  if(objection < 75) cons.push(consBank.objection);
  if(need < 75) cons.push(consBank.need);
  if(close < 75) cons.push(consBank.close);
  if(empathy < 75) cons.push(consBank.empathy);
  if(script < 75) cons.push(consBank.script);
  if(cons.length === 0) cons.push('Можно поработать над увеличением среднего чека - был запрос на VIP-тариф');

  const recs = {
    win:`Закрепить звонок ${m.name.split(' ')[0]}а(ы) как эталонный. Отправить на разбор всей команде на ближайшей планёрке.`,
    next:`Назначить контрольный звонок через 48 часов. Дать ${m.name.split(' ')[0]}у(е) скрипт по работе с возражениями.`,
    lost:`Срочный разбор с РОПом 1-на-1. Прослушать эталонные звонки топ-менеджеров. Контрольная встреча через 24 часа.`,
  };

  return {
    script:sc[0], objection:sc[1], empathy:sc[2], need:sc[3], close:sc[4],
    result,
    summary: summaries[result],
    pros,
    cons: cons.slice(0,3),
    rec: recs[result],
    flags,
  };
}

  modalRoot.querySelector('.modal-foot').style.display = 'none';

// Очищаем любые старые ключи из localStorage
try { localStorage.removeItem('claude_api_key'); } catch(e){}

function addNewCall(ai, transcript, mgrId, client, topic, durMin){
  const id = 'live_' + Date.now();
  const score = Math.round((ai.script + ai.objection + ai.empathy + ai.need + ai.close)/5);
  const now = new Date();
  const time = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');

  CALLS.unshift({
    id, mgr: mgrId, time, dur: durMin + 'м',
    client, topic, result: ai.result, score,
    scores: [ai.script, ai.objection, ai.empathy, ai.need, ai.close],
    isLive: true,
  });

  // Build transcript lines from raw text - split by sentence/punctuation
  const m = MANAGERS.find(x => x.id === mgrId);
  const lines = buildLinesFromText(transcript, m.name.split(' ')[0], client.split(' ')[0], ai.flags || []);

  TRANSCRIPTS[id] = {
    summary: ai.summary,
    pros: ai.pros || [],
    cons: ai.cons || [],
    rec: ai.rec,
    lines,
  };

  // Bump manager stats for current period
  const period = currentPeriod;
  const stats = STATS[mgrId][period];
  stats.calls += 1;
  if(ai.result === 'win'){ stats.deals += 1; stats.sum += 110000; }

  closeModal();
  location.hash = '#/call/' + id;
}

function buildLinesFromText(text, mgrName, clientName, flags){
  // Split into sentences. If transcript contains "Менеджер:" / "Клиент:" markers, parse those.
  const hasMarkers = /(менеджер|клиент)\s*[:—-]/i.test(text);
  let lines = [];
  if(hasMarkers){
    const parts = text.split(/(?=(?:менеджер|клиент)\s*[:—-])/i);
    parts.forEach(p => {
      const m = p.match(/^(менеджер|клиент)\s*[:—-]\s*(.+)$/is);
      if(m){
        lines.push({who: m[1].toLowerCase().startsWith('м') ? 'mgr' : 'client', text: m[2].trim()});
      }
    });
  } else {
    // Split by sentences, alternate speakers as fallback
    const sentences = text.split(/(?<=[.!?])\s+/).filter(s => s.trim().length > 4);
    sentences.forEach((s, i) => {
      lines.push({who: i % 2 === 0 ? 'mgr' : 'client', text: s.trim()});
    });
  }

  // Match flags to lines
  flags.forEach(f => {
    const phrase = (f.phrase || '').toLowerCase().slice(0, 40);
    const idx = lines.findIndex(l => l.text.toLowerCase().includes(phrase) && phrase.length > 8);
    if(idx >= 0){
      lines[idx].flag = f.type === 'good' ? 'good' : 'bad';
      lines[idx].flagText = f.reason || (f.type === 'good' ? 'Сильный момент' : 'Проблемная зона');
    }
  });

  return lines.length ? lines : [{who:'mgr', text}];
}
